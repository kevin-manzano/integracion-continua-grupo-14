$kind: http-request
name: 'GET /health'
method: GET
url: '{{baseUrl}}/health'
order: 2000
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('db is connected', () => {
        const json = pm.response.json();
        pm.expect(json.status).to.eql('ok');
        pm.expect(json.db).to.eql('connected');
      });
