$kind: http-request
name: 'GET / (welcome message)'
method: GET
url: '{{baseUrl}}/'
order: 1000
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('has message field', () => {
        const json = pm.response.json();
        pm.expect(json).to.have.property('message');
      });
